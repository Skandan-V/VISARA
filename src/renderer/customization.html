<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize Dynamic Island - Visara</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="customization.css">
    <link rel="stylesheet" href="island.css">
</head>
<body>

    <header>
        <div class="title-group" style="-webkit-app-region: no-drag;">
            <button class="icon-btn" id="btnBack" title="Back to Dashboard">
                <svg width="18" height="18" viewBox="0 0 24 24" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
            </button>
            <span class="title-count" style="font-weight: 500;">Customize Island</span>
        </div>
        <div class="header-actions" style="-webkit-app-region: no-drag;">
            <button class="icon-btn" id="btnMinimize" title="Minimize">
                <svg width="18" height="18" viewBox="0 0 24 24" stroke-width="1.5"><path d="M5 12h14"></path></svg>
            </button>
            <button class="icon-btn" id="btnMaximize" title="Maximize / Restore">
                <svg width="16" height="16" viewBox="0 0 24 24" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
            </button>
            <button class="icon-btn" id="btnClose" title="Close to Tray">
                <svg width="18" height="18" viewBox="0 0 24 24" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12"></path></svg>
            </button>
        </div>
    </header>

    <main class="responsive-container" style="padding: 16px 24px;">
        <div class="section-divider" style="margin-bottom: 12px;"></div>

        <div class="desktop-customization-grid">
            <!-- Left Column on Desktop: Live Preview Hero Stage -->
            <div class="desktop-grid-left">
                <div class="timer-hero preview-hero-card" style="padding: 24px 16px; margin-bottom: 12px;">
                    <div class="preview-stage">
                        <div class="dynamic-island" id="previewIsland">
                            <!-- Left Edge Animation Avatar -->
                            <div class="island-avatar" id="previewAvatar">
                                <!-- 1. Compass -->
                                <svg class="pl-loader" id="prevCompass" viewBox="0 0 160 160" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
                                    <defs>
                                        <linearGradient id="gradP" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="0%" stop-color="#000" />
                                            <stop offset="100%" stop-color="#fff" />
                                        </linearGradient>
                                        <mask id="mask1P">
                                            <rect x="0" y="0" width="160" height="160" fill="url(#gradP)" />
                                        </mask>
                                    </defs>
                                    <g>
                                        <g class="pl__ring-rotate">
                                            <circle class="pl__ring-stroke" cx="80" cy="80" r="72" fill="none" stroke="hsl(223,90%,55%)" stroke-width="16" stroke-dasharray="452.39 452.39" stroke-dashoffset="452" stroke-linecap="round" transform="rotate(-45,80,80)" />
                                        </g>
                                    </g>
                                </svg>

                                <!-- 2. Hamster -->
                                <div aria-label="Hamster running in wheel" role="img" class="wheel-and-hamster" id="prevHamster">
                                    <div class="wheel"></div>
                                    <div class="hamster">
                                        <div class="hamster__body">
                                            <div class="hamster__head">
                                                <div class="hamster__ear"></div>
                                                <div class="hamster__eye"></div>
                                            </div>
                                            <div class="hamster__limb hamster__limb--fr"></div>
                                            <div class="hamster__limb hamster__limb--fl"></div>
                                        </div>
                                    </div>
                                    <div class="spoke"></div>
                                </div>

                                <!-- 3. Pulse Wave -->
                                <div class="pulse-wave-anim" id="prevPulse">
                                    <div class="pulse-ring"></div>
                                    <div class="pulse-core"></div>
                                </div>

                                <!-- 4. Orbiter Dots -->
                                <div class="orbiter-anim" id="prevOrbiter">
                                    <div class="orbiter-dot d1"></div>
                                    <div class="orbiter-dot d2"></div>
                                </div>

                                <!-- 5. Pencil -->
                                <svg xmlns="http://www.w3.org/2000/svg" height="22" width="22" viewBox="0 0 200 200" class="pencil" id="prevPencil" style="color: #3b82f6;">
                                    <defs>
                                        <clipPath id="pencil-eraser-prev">
                                            <rect height="30" width="30" ry="5" rx="5" />
                                        </clipPath>
                                    </defs>
                                    <circle transform="rotate(-113,100,100)" stroke-linecap="round" stroke-dashoffset="439.82" stroke-dasharray="439.82 439.82" stroke-width="6" stroke="#3b82f6" fill="none" r="70" class="pencil__stroke" />
                                    <g transform="translate(100,100)" class="pencil__rotate">
                                        <g fill="none">
                                            <circle transform="rotate(-90)" stroke-dashoffset="402" stroke-dasharray="402.12 402.12" stroke-width="30" stroke="hsl(223,90%,50%)" r="64" class="pencil__body1" />
                                            <circle transform="rotate(-90)" stroke-dashoffset="465" stroke-dasharray="464.96 464.96" stroke-width="10" stroke="hsl(223,90%,60%)" r="74" class="pencil__body2" />
                                            <circle transform="rotate(-90)" stroke-dashoffset="339" stroke-dasharray="339.29 339.29" stroke-width="10" stroke="hsl(223,90%,40%)" r="54" class="pencil__body3" />
                                        </g>
                                        <g transform="rotate(-90) translate(49,0)" class="pencil__eraser">
                                            <g class="pencil__eraser-skew">
                                                <rect fill="hsl(223,90%,70%)" height="30" width="30" ry="5" rx="5" />
                                                <rect fill="hsl(223,10%,90%)" height="30" width="5" />
                                                <rect fill="hsl(223,10%,70%)" height="30" width="30" clip-path="url(#pencil-eraser-prev)" />
                                            </g>
                                        </g>
                                        <g transform="rotate(-90) translate(49,-30)" class="pencil__point">
                                            <polygon fill="hsl(33,90%,70%)" points="15 0,30 30,0 30" />
                                            <polygon fill="hsl(223,90%,20%)" points="15 0,20 10,10 10" />
                                        </g>
                                    </g>
                                </svg>

                                <!-- 6. Pokeball -->
                                <div class="pokeball-loader" id="prevPokeball"></div>

                                <!-- 7. Radar -->
                                <div class="radar-loader" id="prevRadar"><span></span></div>

                                <!-- 8. Infinity -->
                                <div class="infinity-loader" id="prevInfinity">
                                    <svg viewBox="0 0 100 50" width="22" height="12" class="infinity-svg">
                                        <path stroke="#ec4899" stroke-width="8" fill="none" stroke-linecap="round" d="M 20,25 C 20,10 40,10 50,25 C 60,40 80,40 80,25 C 80,10 60,10 50,25 C 40,40 20,40 20,25 Z" class="infinity-path" />
                                    </svg>
                                </div>

                                <!-- 9. Conic -->
                                <div class="conic-loader" id="prevConic"></div>

                                <!-- 10. Diamond -->
                                <div class="diamond-loader" id="prevDiamond"></div>

                                <!-- 11. Tachometer Gauge -->
                                <svg class="tacho-loader" viewBox="0 0 160 160" width="22" height="22" id="prevMonster" style="display: none;" xmlns="http://www.w3.org/2000/svg">
                                    <g class="tacho__ring-rotate">
                                        <circle class="tacho__ring-stroke" cx="80" cy="80" r="72" fill="none" stroke="#00b4d8" stroke-width="16" stroke-dasharray="452.39 452.39" stroke-dashoffset="452" stroke-linecap="round" transform="rotate(-45,80,80)"></circle>
                                    </g>
                                    <g stroke-width="4" stroke-dasharray="12 12" stroke-dashoffset="12" stroke-linecap="round" transform="translate(80,80)">
                                        <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(-135,0,0) translate(0,40)"></polyline>
                                        <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(-90,0,0) translate(0,40)"></polyline>
                                        <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(-45,0,0) translate(0,40)"></polyline>
                                        <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(0,0,0) translate(0,40)"></polyline>
                                        <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(45,0,0) translate(0,40)"></polyline>
                                        <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(90,0,0) translate(0,40)"></polyline>
                                        <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(135,0,0) translate(0,40)"></polyline>
                                        <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(180,0,0) translate(0,40)"></polyline>
                                    </g>
                                    <g transform="translate(64,28)">
                                        <g class="tacho__arrows" transform="rotate(45,16,52)">
                                            <path fill="#f1f5f9" d="M17.998,1.506l13.892,43.594c.455,1.426-.56,2.899-1.998,2.899H2.108c-1.437,0-2.452-1.473-1.998-2.899L14.002,1.506c.64-2.008,3.356-2.008,3.996,0Z"></path>
                                            <path fill="#ff4c5a" d="M14.009,102.499L.109,58.889c-.453-1.421,.559-2.889,1.991-2.889H29.899c1.433,0,2.444,1.468,1.991,2.889l-13.899,43.61c-.638,2.001-3.345,2.001-3.983,0Z"></path>
                                        </g>
                                    </g>
                                </svg>

                                <!-- 12. Blazing Fire -->
                                <div class="fire-loader" id="prevFire">
                                    <div class="fire">
                                        <div class="fire-left">
                                            <div class="main-fire"></div>
                                            <div class="particle-fire"></div>
                                        </div>
                                        <div class="fire-center">
                                            <div class="main-fire"></div>
                                            <div class="particle-fire"></div>
                                        </div>
                                        <div class="fire-right">
                                            <div class="main-fire"></div>
                                            <div class="particle-fire"></div>
                                        </div>
                                        <div class="fire-bottom">
                                            <div class="main-fire"></div>
                                        </div>
                                    </div>
                                </div>

                                <!-- 13. Valorant Shard -->
                                <div class="valorant-loader" id="prevValorant">
                                    <div class="loader">
                                        <div class="pattern-1">
                                            <div class="pattern-1-shade"></div>
                                        </div>
                                        <div class="pattern-2"></div>
                                    </div>
                                </div>

                                <!-- 14. Sunny Cloud -->
                                <div class="suncloud-loader" id="prevSuncloud" style="display: none;">
                                    <div class="container">
                                        <div class="cloud front">
                                            <span class="left-front"></span>
                                            <span class="right-front"></span>
                                        </div>
                                        <span class="sun sunshine"></span>
                                        <span class="sun"></span>
                                        <div class="cloud back">
                                            <span class="left-back"></span>
                                            <span class="right-back"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Right Edge Group -->
                            <div class="island-right-group">
                                <div class="extra-controls" id="previewExtraControls">
                                    <button class="island-btn-add">+5m</button>
                                    <button class="island-btn-icon">
                                        <svg width="12" height="12" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83"></path></svg>
                                    </button>
                                    <button class="island-btn-play">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="#ffffff" id="prevPlayIcon" style="color: #ffffff;">
                                            <rect x="6" y="5" width="3" height="14" rx="1"></rect>
                                            <rect x="15" y="5" width="3" height="14" rx="1"></rect>
                                        </svg>
                                    </button>
                                    <button class="island-btn-icon dismiss">
                                        <svg width="12" height="12" viewBox="0 0 24 24" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                                    </button>
                                </div>
                                <div class="island-timer" id="previewTimer">20:00</div>
                            </div>
                        </div>
                    </div>
                    <div class="timer-label" style="margin-top: 6px; margin-bottom: 0;">Hover to test expansion preview</div>
                </div>
            </div>

            <!-- Right Column on Desktop: Swatches & Color Controls -->
            <div class="desktop-grid-right">
                <!-- Row 1: Animation Circles -->
                <div class="row" style="flex-direction: column; align-items: flex-start; gap: 8px; padding: 8px 0;">
                    <div class="label">Avatar Animation</div>
                    <div class="circle-swatch-row" id="animCircleRow">
                        <!-- Circle 0: No Animation -->
                        <div class="circle-anim-swatch" data-anim="none" title="No Animation (Centered Timer)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                            </svg>
                        </div>

                        <!-- Circle 1: Running Hamster -->
                        <div class="circle-anim-swatch active" data-anim="hamster" title="Running Hamster">
                            <div class="wheel-and-hamster" style="font-size: 1.8px;">
                                <div class="wheel"></div>
                                <div class="hamster">
                                    <div class="hamster__body">
                                        <div class="hamster__head"><div class="hamster__eye"></div></div>
                                        <div class="hamster__limb hamster__limb--fr"></div>
                                        <div class="hamster__limb hamster__limb--fl"></div>
                                    </div>
                                </div>
                                <div class="spoke"></div>
                            </div>
                        </div>

                        <!-- Circle 2: Compass Gyro -->
                        <div class="circle-anim-swatch" data-anim="compass" title="Compass Gyro">
                            <svg class="pl-loader" viewBox="0 0 160 160" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                                <g class="pl__ring-rotate">
                                    <circle class="pl__ring-stroke" cx="80" cy="80" r="72" fill="none" stroke="hsl(223,90%,55%)" stroke-width="18" />
                                </g>
                            </svg>
                        </div>

                        <!-- Circle 3: Pulse Wave -->
                        <div class="circle-anim-swatch" data-anim="pulse" title="Pulse Wave">
                            <div class="pulse-wave-anim">
                                <div class="pulse-ring"></div>
                                <div class="pulse-core"></div>
                            </div>
                        </div>

                        <!-- Circle 4: Orbiter Dots -->
                        <div class="circle-anim-swatch" data-anim="orbiter" title="Orbiter Dots">
                                <div class="orbiter-anim">
                                <div class="orbiter-dot d1"></div>
                                <div class="orbiter-dot d2"></div>
                            </div>
                        </div>
                        <!-- Circle 5: Animated Pencil -->
                        <div class="circle-anim-swatch" data-anim="pencil" title="Animated Pencil">
                            <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20" viewBox="0 0 200 200" class="pencil" style="color: #3b82f6;">
                                <defs>
                                    <clipPath id="pencil-eraser-swatch">
                                        <rect height="30" width="30" ry="5" rx="5" />
                                    </clipPath>
                                </defs>
                                <circle transform="rotate(-113,100,100)" stroke-linecap="round" stroke-dashoffset="439.82" stroke-dasharray="439.82 439.82" stroke-width="6" stroke="#3b82f6" fill="none" r="70" class="pencil__stroke" />
                                <g transform="translate(100,100)" class="pencil__rotate">
                                    <g fill="none">
                                        <circle transform="rotate(-90)" stroke-dashoffset="402" stroke-dasharray="402.12 402.12" stroke-width="30" stroke="hsl(223,90%,50%)" r="64" class="pencil__body1" />
                                        <circle transform="rotate(-90)" stroke-dashoffset="465" stroke-dasharray="464.96 464.96" stroke-width="10" stroke="hsl(223,90%,60%)" r="74" class="pencil__body2" />
                                        <circle transform="rotate(-90)" stroke-dashoffset="339" stroke-dasharray="339.29 339.29" stroke-width="10" stroke="hsl(223,90%,40%)" r="54" class="pencil__body3" />
                                    </g>
                                    <g transform="rotate(-90) translate(49,0)" class="pencil__eraser">
                                        <g class="pencil__eraser-skew">
                                            <rect fill="hsl(223,90%,70%)" height="30" width="30" ry="5" rx="5" />
                                            <rect fill="hsl(223,10%,90%)" height="30" width="5" />
                                            <rect fill="hsl(223,10%,70%)" height="30" width="30" clip-path="url(#pencil-eraser-swatch)" />
                                        </g>
                                    </g>
                                    <g transform="rotate(-90) translate(49,-30)" class="pencil__point">
                                        <polygon fill="hsl(33,90%,70%)" points="15 0,30 30,0 30" />
                                        <polygon fill="hsl(223,90%,20%)" points="15 0,20 10,10 10" />
                                    </g>
                                </g>
                            </svg>
                        </div>

                        <!-- Circle 6: Pokeball Bounce -->
                        <div class="circle-anim-swatch" data-anim="pokeball" title="Pokeball Bounce">
                            <div class="pokeball-loader" style="width: 16px; height: 16px;"></div>
                        </div>

                        <!-- Circle 7: Radar Sweep -->
                        <div class="circle-anim-swatch" data-anim="radar" title="Radar Sweep">
                            <div class="radar-loader" style="width: 18px; height: 18px;"><span></span></div>
                        </div>

                        <!-- Circle 8: Infinity Loop -->
                        <div class="circle-anim-swatch" data-anim="infinity" title="Infinity Loop">
                            <svg viewBox="0 0 100 50" width="20" height="10" class="infinity-svg">
                                <path stroke="#ec4899" stroke-width="8" fill="none" stroke-linecap="round" d="M 20,25 C 20,10 40,10 50,25 C 60,40 80,40 80,25 C 80,10 60,10 50,25 C 40,40 20,40 20,25 Z" class="infinity-path" />
                            </svg>
                        </div>

                        <!-- Circle 9: Conic Orbit -->
                        <div class="circle-anim-swatch" data-anim="conic" title="Conic Orbit">
                            <div class="conic-loader" style="width: 16px; height: 16px;"></div>
                        </div>

                        <!-- Circle 10: Morphing Diamond -->
                        <div class="circle-anim-swatch" data-anim="diamond" title="Morphing Diamond">
                            <div class="diamond-loader" style="width: 12px; height: 12px;"></div>
                        </div>

                        <!-- Circle 11: Tachometer Gauge -->
                        <div class="circle-anim-swatch" data-anim="monster" title="Tachometer Gauge">
                            <svg class="tacho-loader" viewBox="0 0 160 160" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                                <g class="tacho__ring-rotate">
                                    <circle class="tacho__ring-stroke" cx="80" cy="80" r="72" fill="none" stroke="#00b4d8" stroke-width="16" stroke-dasharray="452.39 452.39" stroke-dashoffset="452" stroke-linecap="round" transform="rotate(-45,80,80)"></circle>
                                </g>
                                <g stroke-width="4" stroke-dasharray="12 12" stroke-dashoffset="12" stroke-linecap="round" transform="translate(80,80)">
                                    <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(-135,0,0) translate(0,40)"></polyline>
                                    <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(-90,0,0) translate(0,40)"></polyline>
                                    <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(-45,0,0) translate(0,40)"></polyline>
                                    <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(0,0,0) translate(0,40)"></polyline>
                                    <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(45,0,0) translate(0,40)"></polyline>
                                    <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(90,0,0) translate(0,40)"></polyline>
                                    <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(135,0,0) translate(0,40)"></polyline>
                                    <polyline class="tacho__tick" stroke="hsl(223,10%,90%)" points="0,2 0,14" transform="rotate(180,0,0) translate(0,40)"></polyline>
                                </g>
                                <g transform="translate(64,28)">
                                    <g class="tacho__arrows" transform="rotate(45,16,52)">
                                        <path fill="#f1f5f9" d="M17.998,1.506l13.892,43.594c.455,1.426-.56,2.899-1.998,2.899H2.108c-1.437,0-2.452-1.473-1.998-2.899L14.002,1.506c.64-2.008,3.356-2.008,3.996,0Z"></path>
                                        <path fill="#ff4c5a" d="M14.009,102.499L.109,58.889c-.453-1.421,.559-2.889,1.991-2.889H29.899c1.433,0,2.444,1.468,1.991,2.889l-13.899,43.61c-.638,2.001-3.345,2.001-3.983,0Z"></path>
                                    </g>
                                </g>
                            </svg>
                        </div>

                        <!-- Circle 12: Blazing Fire -->
                        <div class="circle-anim-swatch" data-anim="fire" title="Blazing Fire">
                            <div class="fire-loader" style="width: 16px; height: 16px;">
                                <div class="fire">
                                    <div class="fire-left">
                                        <div class="main-fire"></div>
                                        <div class="particle-fire"></div>
                                    </div>
                                    <div class="fire-center">
                                        <div class="main-fire"></div>
                                        <div class="particle-fire"></div>
                                    </div>
                                    <div class="fire-right">
                                        <div class="main-fire"></div>
                                        <div class="particle-fire"></div>
                                    </div>
                                    <div class="fire-bottom">
                                        <div class="main-fire"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Circle 13: Valorant Shard -->
                        <div class="circle-anim-swatch" data-anim="valorant" title="Valorant Shard">
                            <div class="valorant-loader">
                                <div class="loader">
                                    <div class="pattern-1">
                                        <div class="pattern-1-shade"></div>
                                    </div>
                                    <div class="pattern-2"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Circle 14: Sunny Cloud -->
                        <div class="circle-anim-swatch" data-anim="suncloud" title="Sunny Cloud">
                            <div class="suncloud-loader">
                                <div class="container">
                                    <div class="cloud front">
                                        <span class="left-front"></span>
                                        <span class="right-front"></span>
                                    </div>
                                    <span class="sun sunshine"></span>
                                    <span class="sun"></span>
                                    <div class="cloud back">
                                        <span class="left-back"></span>
                                        <span class="right-back"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Row 2: Timer Accent Colors (+ Add Custom Color) -->
                <div class="row" style="flex-direction: column; align-items: flex-start; gap: 8px; padding: 8px 0;">
                    <div class="label">Timer Accent Color</div>
                    <div class="circle-swatch-row" id="timerColorPalette">
                        <!-- Swatches rendered dynamically in JS -->
                        <label class="color-swatch add-custom-swatch" title="Add Custom Accent Color">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            <input type="color" id="timerColorInput" style="opacity: 0; position: absolute; width: 0; height: 0;">
                        </label>
                    </div>
                </div>

                <!-- Row 3: Island Background Theme (+ Add Custom BG) -->
                <div class="row" style="flex-direction: column; align-items: flex-start; gap: 8px; padding: 8px 0;">
                    <div class="label">Island Background Theme</div>
                    <div class="circle-swatch-row" id="bgThemePalette">
                        <!-- Swatches rendered dynamically in JS -->
                        <label class="color-swatch add-custom-swatch" title="Add Custom Background Theme">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            <input type="color" id="bgColorInput" style="opacity: 0; position: absolute; width: 0; height: 0;">
                        </label>
                    </div>
                </div>

                <!-- Apply Button -->
                <div style="margin-top: 18px; margin-bottom: 12px;">
                    <button class="btn-pill" id="btnApplyCustomizations" style="width: 100%; justify-content: center; padding: 12px 24px;">
                        Apply Customizations
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="../audio.js"></script>
    <script src="customization.js"></script>
</body>
</html>
